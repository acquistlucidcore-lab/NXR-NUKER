name: Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp colorama pyyaml pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --console --name NXR_NUKER_PROTOCOL nxr_nuker_protocol.py

      - name: Show dist
        run: dir dist

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: NXR_NUKER_PROTOCOL-exe
          path: dist/NXR_NUKER_PROTOCOL.exe
          if-no-files-found: error
